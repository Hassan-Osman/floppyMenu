<style>

.btn.lang{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:800;font-size:1.05rem;padding:12px 22px}

.btn.wa{background:var(--wa);border-color:var(--wa);color:#04210f}

.group h2{font-size:1.55rem;margin-bottom:4px}
.group .sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.ic{font-size:1.7rem;line-height:1;margin-bottom:10px}
.card h3{font-size:1.1rem;margin-bottom:8px}
.card p{margin:0 0 14px;color:var(--muted);font-size:.95rem;flex:1}
.price{margin:0 0 12px;padding-top:12px;border-top:1px solid var(--line);font-weight:700;font-size:1.05rem}
.price small{display:block;font-weight:500;color:var(--muted);font-size:.84rem}
.card a{align-self:flex-start;font-weight:600;font-size:.94rem;color:var(--accent);text-decoration:none;padding:4px 0}

footer{padding:20px 0 28px;color:var(--muted);font-size:.88rem;text-align:center}
